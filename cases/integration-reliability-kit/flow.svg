<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Integration Reliability Kit 처리 흐름</title>
  <desc id="desc">API, ERP, 파일 입력이 정규화와 검증을 거쳐 정상 처리와 실패 로그, 재처리로 나뉘는 흐름</desc>
  <rect width="1200" height="1200" rx="96" fill="#eef5ff"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033">
    <text x="600" y="120" font-size="54" font-weight="800">Integration Reliability Kit</text>
    <g font-size="34" font-weight="700">
      <rect x="90" y="225" width="250" height="112" rx="28" fill="#ffffff" stroke="#8ba7cc" stroke-width="5"/><text x="215" y="295">API · ERP · 파일</text>
      <rect x="475" y="225" width="250" height="112" rx="28" fill="#dcecff" stroke="#4e78ad" stroke-width="5"/><text x="600" y="295">정규화 · 매핑</text>
      <rect x="860" y="225" width="250" height="112" rx="28" fill="#dcecff" stroke="#4e78ad" stroke-width="5"/><text x="985" y="295">검증 · 멱등성</text>
    </g>
    <g stroke="#4e78ad" stroke-width="10" fill="none"><path d="M340 281h135"/><path d="M725 281h135"/></g>
    <g font-size="32" font-weight="700">
      <rect x="140" y="520" width="370" height="150" rx="34" fill="#dcf7e8" stroke="#2d9462" stroke-width="6"/><text x="325" y="585">정상 처리</text><text x="325" y="630" font-size="25" font-weight="500">합계 · 체크섬 확인</text>
      <rect x="690" y="520" width="370" height="150" rx="34" fill="#fff0d4" stroke="#ba7b16" stroke-width="6"/><text x="875" y="585">부분 실패</text><text x="875" y="630" font-size="25" font-weight="500">오류 행만 격리</text>
      <rect x="690" y="825" width="370" height="150" rx="34" fill="#ffffff" stroke="#4e78ad" stroke-width="6"/><text x="875" y="890">수동 재처리</text><text x="875" y="935" font-size="25" font-weight="500">수정한 행만 다시 실행</text>
    </g>
    <g stroke="#4e78ad" stroke-width="10" fill="none"><path d="M985 337v95H325v88"/><path d="M985 432H875v88"/><path d="M875 670v155"/></g>
    <text x="600" y="1090" font-size="28" fill="#51647f">정상·실패·복구를 하나의 검증 가능한 실행 기록으로</text>
  </g>
</svg>
